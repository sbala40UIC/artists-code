<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Gradient Button</title>

  <!-- Connect the CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button id="randomBtn">Random Gradient</button>

  <script> // javascript
    document.getElementById('randomBtn').addEventListener('click', function() {

      // Generate random colors
      const color1 = `hsl(${Math.random() * 360}, 70%, 50%)`; //Math.random() generates a random decimal from 0 to 1 and my codes uses it to get a random hue
      const color2 = `hsl(${Math.random() * 360}, 70%, 50%)`;

      // Create a random gradient
      const gradient = `linear-gradient(  
        ${Math.random() < 0.5 ? 'to right' : 'to bottom'}, ${color1}, ${color2})`;  // linear-gradient(direction, color1, color2) which way the gradient goes and what colors

      // Apply the gradient to the body
      document.body.style.background = gradient;
    });
  </script>

</body>
</html>
